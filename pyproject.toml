[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mysear-qbot-runtime"
version = "0.1.0"
description = "Stable Python runtime facade for Qbot integrations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qbot contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
tree = [
  "lightgbm>=4.6,<5",
  "xgboost>=2,<3",
  "catboost>=1.2,<2",
]
deep = ["torch>=2.2,<3"]
backtest = [
  "backtrader>=1.9",
  "quantstats>=0.0.64",
  "empyrical>=0.5.5",
]
data = [
  "akshare>=1.16",
  "yfinance>=0.2",
  "efinance>=0.5",
]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["qbot_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests/runtime"]
pythonpath = ["src"]
