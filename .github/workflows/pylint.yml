name: Pylint

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint isort black flake8

    - name: Format check
      shell: bash
      run: |
        files=$(git diff --name-only HEAD~1..HEAD -- '*.py')
        if [[ -z "$files" ]]; then
          echo "No Python files changed; format check passed."
          exit 0
        fi
        black --check $files
        isort --check-only $files
        flake8 $files

    # - name: Analysing the code with pylint
    #   run: |
    #     pylint $(git ls-files '*.py')
